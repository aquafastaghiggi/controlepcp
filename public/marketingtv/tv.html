<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Marketing TV - Aquafast</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="app-shell tv-shell">
    <div class="tv-backdrop"></div>
    <section class="tv-layout tv-layout-minimal">
        <header class="tv-topbar tv-topbar-minimal">
            <div class="brand brand-inverse">
                <img src="assets/logo-aquafast.svg" alt="Aquafast" class="brand-logo brand-logo-large">
            </div>
        </header>

        <div class="tv-frame">
            <div class="tv-screen">
                <div class="screen-glow"></div>
                <img id="carouselImage" class="carousel-image" alt="Carrossel de imagens">
                <div id="emptyState" class="tv-empty-state">
                    <div class="tv-empty-card">
                        <img src="assets/logo-aquafast.svg" alt="Aquafast" class="empty-logo">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="assets/tv.js"></script>
</body>
</html>
