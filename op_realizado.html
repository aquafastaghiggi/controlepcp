<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruzamento OP - Planejado vs Realizado CODI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        h1 { color: #333; font-size: 32px; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; }
        
        .search-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .search-box button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .search-box button:hover {
            background: #5568d3;
        }
        
        .op-list {
            background: white;
            border-radius: 6px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
        }
        
        .op-item {
            padding: 10px;
            margin: 5px 0;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .op-item:hover {
            background: #efefef;
        }
        
        .op-item strong { color: #667eea; }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
            color: #333;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        
        .info-row label {
            color: #666;
            font-weight: 600;
        }
        
        .info-row value {
            color: #333;
            font-weight: 500;
        }
        
        .qty-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #667eea;
        }
        
        .qty-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .qty-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .comparison-item {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .comparison-item-label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .comparison-item-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        .accordion {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .accordion-header {
            background: #f9f9f9;
            padding: 15px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            transition: background 0.2s;
        }
        
        .accordion-header:hover {
            background: #efefef;
        }
        
        .accordion-content {
            display: none;
            padding: 15px;
            background: white;
        }
        
        .accordion-content.active {
            display: block;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin: 5px 0;
        }
        
        .status-planejado {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .status-iniciado {
            background: #fff3e0;
            color: #e65100;
        }
        
        .status-em-progresso {
            background: #e1f5fe;
            color: #01579b;
        }
        
        .status-finalizado {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #f44336;
            margin: 15px 0;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #4caf50;
            margin: 15px 0;
        }
        
        .table-mini {
            width: 100%;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .table-mini th {
            background: #667eea;
            color: white;
            padding: 8px;
            text-align: left;
            font-weight: 600;
        }
        
        .table-mini td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        
        .table-mini tr:hover {
            background: #f9f9f9;
        }
        
        .deviation {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .deviation-positive {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .deviation-negative {
            background: #ffebee;
            color: #c62828;
        }
        
        .timeline {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📊 Cruzamento OP - Planejado vs CODI Realizado</h1>
        <p class="subtitle">Busque uma Ordem de Produção para ver o planejamento vs execução real</p>
    </header>
    
    <div class="search-section">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Buscar OP (ex: 201055)..." onkeyup="searchOPs()">
            <button onclick="loadOP()">🔍 Buscar</button>
        </div>
        <div id="op-list" class="op-list" style="display:none;">
            <!-- Lista de OPs -->
        </div>
    </div>
    
    <div id="main-content" class="main-content" style="display:none;">
        <!-- Planejado -->
        <div class="card">
            <h2>📋 PLANEJADO (Seu Sistema)</h2>
            <div id="planejado-content">
                <div class="loading"><span class="spinner"></span>Carregando...</div>
            </div>
        </div>
        
        <!-- Realizado -->
        <div class="card">
            <h2>🏭 REALIZADO (CODI)</h2>
            <div id="realizado-content">
                <div class="loading"><span class="spinner"></span>Carregando...</div>
            </div>
        </div>
    </div>
    
    <!-- Comparação detalhada -->
    <div id="comparison-section" style="display:none;">
        <div class="card">
            <h2>⚖️ COMPARATIVO DETALHADO</h2>
            <div id="comparison-content"></div>
        </div>
    </div>
</div>

<script>
let allOPs = [];
let selectedOP = null;

// Carregar lista de OPs ao iniciar
async function loadOPList() {
    try {
        const response = await fetch('api_cruzamento_avancado.php?action=lista_ops');
        if (!response.ok) throw new Error('Erro ao carregar OPs');
        
        const data = await response.json();
        if (data.status === 'ok') {
            allOPs = data.ops;
            console.log('OPs carregadas:', allOPs.length);
        }
    } catch (error) {
        console.error('Erro:', error);
    }
}

function searchOPs() {
    const search = document.getElementById('search-input').value.toLowerCase();
    const listDiv = document.getElementById('op-list');
    
    if (search.length < 2) {
        listDiv.style.display = 'none';
        return;
    }
    
    const filtered = allOPs.filter(op => 
        op.op.includes(search) || 
        op.skus.toLowerCase().includes(search)
    );
    
    let html = '';
    filtered.slice(0, 15).forEach(op => {
        html += `
            <div class="op-item" onclick="selectOP('${op.op}')">
                <strong>OP ${op.op}</strong><br>
                SKUs: ${op.skus.substring(0, 50)}...
                <br><small>${op.itens_planejados} itens | ${op.execucoes_registradas} execuções CODI</small>
            </div>
        `;
    });
    
    listDiv.innerHTML = html;
    listDiv.style.display = html ? 'block' : 'none';
}

function selectOP(op) {
    document.getElementById('search-input').value = op;
    document.getElementById('op-list').style.display = 'none';
    loadOP();
}

async function loadOP() {
    const op = document.getElementById('search-input').value.trim();
    
    if (!op) {
        alert('Digite uma OP para buscar');
        return;
    }
    
    selectedOP = op;
    document.getElementById('main-content').style.display = 'grid';
    document.getElementById('comparison-section').style.display = 'none';
    
    // Limpar conteúdo
    document.getElementById('planejado-content').innerHTML = '<div class="loading"><span class="spinner"></span>Carregando planejado...</div>';
    document.getElementById('realizado-content').innerHTML = '<div class="loading"><span class="spinner"></span>Carregando realizado do CODI...</div>';
    
    try {
        // Buscar dados da OP
        const response = await fetch(`api_cruzamento_avancado.php?action=detalhe_op&op=${encodeURIComponent(op)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        console.log('Dados da OP:', data);
        
        if (data.status === 'ok' && data.items.length > 0) {
            renderPlanejado(data.items.filter(i => i.tipo === 'Planejado'));
            renderRealizado(data.items.filter(i => i.tipo === 'Realizado'));
            renderComparison(data.items);
        } else {
            document.getElementById('planejado-content').innerHTML = '<div class="error">❌ Nenhum dado encontrado para OP: ' + op + '</div>';
            document.getElementById('realizado-content').innerHTML = '<div class="error">Nenhum registro realizado encontrado</div>';
        }
    } catch (error) {
        console.error('Erro:', error);
        document.getElementById('planejado-content').innerHTML = '<div class="error">❌ Erro: ' + error.message + '</div>';
        document.getElementById('realizado-content').innerHTML = '<div class="error">❌ Erro ao carregar realizado</div>';
    }
}

function renderPlanejado(items) {
    const container = document.getElementById('planejado-content');
    
    if (items.length === 0) {
        container.innerHTML = '<div class="error">Nenhum planejamento encontrado</div>';
        return;
    }
    
    let html = `
        <div class="info-row">
            <label>OP:</label>
            <value><strong>${items[0].op}</strong></value>
        </div>
    `;
    
    let totalQty = 0;
    let skus = new Set();
    let minData = null, maxData = null;
    
    items.forEach(item => {
        totalQty += parseFloat(item.quantidade_planejada || 0);
        skus.add(item.sku);
        
        if (!minData || item.data_planejada < minData) minData = item.data_planejada;
        if (!maxData || item.data_planejada > maxData) maxData = item.data_planejada;
    });
    
    html += `
        <div class="qty-box">
            <div class="qty-label">Quantidade Total Planejada</div>
            <div class="qty-value">${totalQty.toLocaleString('pt-BR', {maximumFractionDigits: 0})}</div>
        </div>
        
        <div class="info-row">
            <label>SKUs Planejados:</label>
            <value>${skus.size}</value>
        </div>
        
        <div class="info-row">
            <label>Data Início:</label>
            <value>${new Date(minData).toLocaleDateString('pt-BR')}</value>
        </div>
        
        <div class="info-row">
            <label>Data Fim:</label>
            <value>${new Date(maxData).toLocaleDateString('pt-BR')}</value>
        </div>
    `;
    
    html += `
        <div class="accordion">
            <div class="accordion-header" onclick="toggleAccordion(this)">
                📦 Itens Planejados (${items.length})
                <span>▼</span>
            </div>
            <div class="accordion-content">
                <table class="table-mini">
                    <thead>
                        <tr>
                            <th>SKU</th>
                            <th>Descrição</th>
                            <th>Qtd</th>
                            <th>Duração</th>
                        </tr>
                    </thead>
                    <tbody>
    `;
    
    items.forEach(item => {
        const dataF = new Date(item.data_planejada).toLocaleDateString('pt-BR');
        html += `
            <tr>
                <td><strong>${item.sku}</strong></td>
                <td>${item.descricao}</td>
                <td>${parseFloat(item.quantidade_planejada).toLocaleString('pt-BR')}</td>
                <td>${item.duracao || '-'} min</td>
            </tr>
        `;
    });
    
    html += `
                    </tbody>
                </table>
            </div>
        </div>
    `;
    
    container.innerHTML = html;
}

function renderRealizado(items) {
    const container = document.getElementById('realizado-content');
    
    if (items.length === 0) {
        container.innerHTML = `
            <div class="error">
                ⚠️ <strong>Nenhum registro realizado encontrado no CODI</strong><br>
                <small>A OP não foi executada ainda ou os dados não foram sincronizados</small>
            </div>
        `;
        return;
    }
    
    let html = `<span class="status-badge status-em-progresso">EM PRODUÇÃO</span>`;
    
    let totalExec = items.length;
    let maquinas = new Set();
    let minData = null, maxData = null;
    
    items.forEach(item => {
        if (item.maquina_realizada) maquinas.add(item.maquina_realizada);
        
        if (item.data_realizada) {
            if (!minData || item.data_realizada < minData) minData = item.data_realizada;
            if (!maxData || item.data_realizada > maxData) maxData = item.data_realizada;
        }
    });
    
    html += `
        <div class="qty-box">
            <div class="qty-label">Registros de Execução</div>
            <div class="qty-value">${totalExec}</div>
        </div>
        
        <div class="info-row">
            <label>Máquinas Utilizadas:</label>
            <value>${maquinas.size}</value>
        </div>
        
        ${minData ? `
        <div class="info-row">
            <label>Data Início Exec:</label>
            <value>${new Date(minData).toLocaleDateString('pt-BR')}</value>
        </div>
        
        <div class="info-row">
            <label>Data Fim Exec:</label>
            <value>${new Date(maxData).toLocaleDateString('pt-BR')}</value>
        </div>
        ` : '<div class="error">Sem datas de execução</div>'}
    `;
    
    if (maquinas.size > 0) {
        html += `
        <div class="info-row">
            <label>Máquinas:</label>
            <value>${Array.from(maquinas).join(', ')}</value>
        </div>
        `;
    }
    
    html += `
        <div class="accordion">
            <div class="accordion-header" onclick="toggleAccordion(this)">
                🔧 Execuções (${items.length})
                <span>▼</span>
            </div>
            <div class="accordion-content">
                <table class="table-mini">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Máquina</th>
                            <th>Item CODI</th>
                        </tr>
                    </thead>
                    <tbody>
    `;
    
    items.forEach(item => {
        const dataF = item.data_realizada ? new Date(item.data_realizada).toLocaleDateString('pt-BR') : '-';
        html += `
            <tr>
                <td>${dataF}</td>
                <td>${item.maquina_realizada || '-'}</td>
                <td>${item.item_codi || '-'}</td>
            </tr>
        `;
    });
    
    html += `
                    </tbody>
                </table>
            </div>
        </div>
    `;
    
    container.innerHTML = html;
}

function renderComparison(allItems) {
    const container = document.getElementById('comparison-content');
    const planejados = allItems.filter(i => i.tipo === 'Planejado');
    const realizados = allItems.filter(i => i.tipo === 'Realizado');
    
    const totalPlan = planejados.reduce((sum, i) => sum + parseFloat(i.quantidade_planejada || 0), 0);
    const execucoes = realizados.length;
    
    let html = `
        <div class="comparison">
            <div class="comparison-item">
                <div class="comparison-item-label">📋 Itens Planejados</div>
                <div class="comparison-item-value">${planejados.length}</div>
            </div>
            <div class="comparison-item">
                <div class="comparison-item-label">🏭 Execuções Realizadas</div>
                <div class="comparison-item-value">${execucoes}</div>
            </div>
            <div class="comparison-item">
                <div class="comparison-item-label">📦 Qtd Total Planejada</div>
                <div class="comparison-item-value">${totalPlan.toLocaleString('pt-BR', {maximumFractionDigits: 0})}</div>
            </div>
            <div class="comparison-item">
                <div class="comparison-item-label">⚙️ Taxa Execução</div>
                <div class="comparison-item-value">${planejados.length > 0 ? ((execucoes / planejados.length) * 100).toFixed(0) : 0}%</div>
            </div>
        </div>
    `;
    
    if (execucoes === 0) {
        html += '<div class="error" style="margin-top: 20px;">⚠️ Nenhuma execução registrada no CODI ainda</div>';
    } else {
        html += `
        <div class="timeline" style="margin-top: 20px;">
            <strong>📊 Status:</strong><br>
            Planejado: ${planejados.length} itens / ${totalPlan.toLocaleString('pt-BR', {maximumFractionDigits: 0})} unidades<br>
            Executado: ${execucoes} registros de produção<br>
            <br><em>⚠️ Importante: Não há mapeamento entre SKUs do seu sistema e CODI. Você precisa validar manualmente se todos os itens foram produzidos.</em>
        </div>
        `;
    }
    
    container.innerHTML = html;
    document.getElementById('comparison-section').style.display = 'block';
}

function toggleAccordion(header) {
    const content = header.nextElementSibling;
    content.classList.toggle('active');
    header.style.background = content.classList.contains('active') ? '#efefef' : '#f9f9f9';
}

// Carregar OPs ao iniciar
window.addEventListener('load', loadOPList);
</script>

</body>
</html>
