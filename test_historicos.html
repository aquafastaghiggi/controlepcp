<!DOCTYPE html>
<html>
<head>
    <title>Teste Históricos - Sequenciamento</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #111; color: #0f0; }
        h1 { color: #0f0; }
        .output { background: #000; padding: 10px; border: 1px solid #0f0; margin-top: 10px; white-space: pre-wrap; word-wrap: break-word; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warning { color: #ff0; }
    </style>
</head>
<body>
    <h1>🔍 Teste Históricos - API Sequenciamento</h1>
    
    <div class="output" id="output">
        Carregando...
    </div>

    <script>
        async function testar() {
            const output = document.getElementById('output');
            
            try {
                // Chamar o API
                output.innerHTML = '<span class="warning">⏳ Chamando /api/sequenciamento.php?action=historicos&periodo=7d...</span>';
                
                const resp = await fetch('/api/sequenciamento.php?action=historicos&periodo=7d');
                const json = await resp.json();
                
                let html = '<span class="success">✅ Resposta recebida:</span>\n\n';
                
                // Resumo
                if (json.resumo) {
                    html += '<span class="success">📊 RESUMO:</span>\n';
                    html += JSON.stringify(json.resumo, null, 2) + '\n\n';
                }
                
                // Dados
                if (json.historicos) {
                    html += `<span class="success">📋 HISTÓRICOS (${json.historicos.length} itens):</span>\n\n`;
                    
                    const primeiros = json.historicos.slice(0, 5);
                    primeiros.forEach((h, idx) => {
                        html += `[${idx}] SKU: ${h.sku} | OP: ${h.numero_op}\n`;
                        html += `     Planejado: ${h.duracao_planejada_minutos}m | Real: ${h.duracao_real_minutos}m | Desvio: ${h.desvio_minutos}m (${h.desvio_percentual}%)\n`;
                        html += `     Data: ${h.data_execucao} | Status: ${h.status_execucao}\n\n`;
                    });
                } else if (json.error) {
                    html += `<span class="error">❌ Erro: ${json.error}</span>`;
                }
                
                output.innerHTML = html;
            } catch (err) {
                output.innerHTML = `<span class="error">❌ Erro ao chamar API: ${err.message}</span>`;
            }
        }
        
        // Auto-testar quando carregar
        window.addEventListener('load', testar);
    </script>
</body>
</html>
